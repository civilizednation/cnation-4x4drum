<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cnation-4x4drum</title>
    <style>
        /* 전반 글씨체 맑은고딕 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a0a1a;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            max-height: 900px;
            background: #111128;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 20, 255, 0.3);
        }
        /* 상단 UI */
        #ui-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 10;
            color: #eee;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        #ui-top .score, #ui-top .level, #ui-top .lives {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #ui-top .lives span {
            color: #ff4466;
            font-size: 1.4rem;
            line-height: 1;
        }
        /* Three.js 캔버스 */
        #three-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* 하단 정보 */
        #ui-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 10;
            color: #aaa;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
        #ui-bottom .version {
            color: #888;
        }
        #ui-bottom .creator {
            color: #aaccff;
            font-weight: bold;
            letter-spacing: 1px;
        }
        /* 게임오버 오버레이 */
        #gameover-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 20;
            color: white;
        }
        #gameover-overlay.show {
            display: flex;
        }
        #gameover-overlay h1 {
            font-size: 3rem;
            color: #ff4466;
            text-shadow: 0 0 30px #ff446688;
            margin-bottom: 10px;
        }
        #gameover-overlay .final-score {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #ffcc44;
        }
        #gameover-overlay button {
            padding: 14px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            background: #3366ff;
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 20px #3366ff66;
            transition: 0.2s;
        }
        #gameover-overlay button:active {
            transform: scale(0.95);
            background: #2255dd;
        }
        /* 모드 선택 (간단히) - 일단 4/4 고정, 이후 확장 */
        #mode-select {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            gap: 12px;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }
        #mode-select button {
            padding: 6px 18px;
            border: 2px solid #6688ff;
            background: transparent;
            color: #ccd9ff;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        #mode-select button.active {
            background: #6688ff;
            color: #fff;
            box-shadow: 0 0 20px #6688ff66;
        }
        #mode-select button:active {
            transform: scale(0.95);
        }
        /* 반응형 */
        @media (max-width: 500px) {
            #ui-top { font-size: 0.9rem; padding: 8px 12px; }
            #ui-bottom { font-size: 0.7rem; padding: 4px 12px; }
            #gameover-overlay h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
<div id="game-container">
    <!-- 상단 UI -->
    <div id="ui-top">
        <div class="score">🎯 <span id="scoreDisplay">0</span></div>
        <div class="level">🏆 Lv.<span id="levelDisplay">1</span></div>
        <div class="lives">❤️ <span id="livesDisplay">❤️❤️❤️</span></div>
    </div>

    <!-- Three.js 캔버스 -->
    <div id="three-canvas"></div>

    <!-- 모드 선택 (임시) -->
    <div id="mode-select">
        <button id="mode4" class="active">4/4</button>
        <button id="mode8">8/8</button>
    </div>

    <!-- 하단 정보 -->
    <div id="ui-bottom">
        <span class="version">v0.1 Beta</span>
        <span class="creator">제작자 : cnation (문명국)</span>
    </div>

    <!-- 게임오버 -->
    <div id="gameover-overlay">
        <h1>💀 GAME OVER</h1>
        <div class="final-score">점수: <span id="finalScore">0</span></div>
        <button id="restartBtn">다시 시작</button>
    </div>
</div>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    (function(){
        "use strict";

        // ========== 설정 ==========
        const BOARD_SIZE = 4;
        const PAD_NAMES = ['a','b','c','d'];
        // 패드 좌표: 열(0~3) -> a,b,c,d / 행(0~3) -> 1,2,3,4
        // Three.js 좌표: x: -1.5 ~ 1.5 (열), y: -1.5 ~ 1.5 (행) (y축 반전)

        // 게임 상태
        let gameMode = '4'; // '4' or '8'
        let score = 0;
        let level = 1;
        let lives = 3;
        let isPlaying = false;
        let isGameOver = false;

        // 패턴 관련
        let patternQueue = []; // [{row, col}, ...]  (4개 또는 8개)
        let userTargetIndex = 0; // 사용자가 눌러야 할 패턴의 인덱스 (3 또는 6부터)
        let patternStartTime = 0;
        let currentStep = 0; // 0: 앱이 표시 중, 1: 사용자 입력 대기
        let stepTimer = 0;
        let interval = 0.5; // 초
        let perfectWindow = 0.2; // 초 (Good)
        let perfectStrict = 0.05; // Perfect

        // 연습 단계
        let practicePhase = 0; // 0~3 (a1,b1,c1 -> d1 ...)
        let practiceActive = true;

        // Three.js
        let scene, camera, renderer;
        let pads = []; // 2D array [row][col]
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let padClickables = [];

        // DOM
        const scoreDisplay = document.getElementById('scoreDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const finalScoreSpan = document.getElementById('finalScore');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const restartBtn = document.getElementById('restartBtn');
        const mode4Btn = document.getElementById('mode4');
        const mode8Btn = document.getElementById('mode8');

        // 사운드 (Web Audio)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, duration, type='sine', volume=0.3) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function soundTick() { playTone(800, 0.08, 'square', 0.15); }
        function soundHit() { playTone(1000, 0.15, 'sine', 0.3); }
        function soundFail() { playTone(300, 0.3, 'sawtooth', 0.2); }
        function soundPerfect() { playTone(1400, 0.2, 'sine', 0.4); }

        // ========== Three.js 초기화 ==========
        function initThree() {
            const container = document.getElementById('three-canvas');
            const w = container.clientWidth || window.innerWidth;
            const h = container.clientHeight || window.innerHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111128);

            camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
            camera.position.set(4, 3, 6);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(w, h);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 조명
            const ambient = new THREE.AmbientLight(0x404060);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(3, 5, 4);
            dirLight.castShadow = true;
            scene.add(dirLight);
            const backLight = new THREE.DirectionalLight(0x4488ff, 0.5);
            backLight.position.set(-2, 1, -3);
            scene.add(backLight);

            // 패드 생성
            const padSize = 0.8;
            const gap = 0.15;
            const total = padSize * 4 + gap * 3;
            const startX = -total/2 + padSize/2;
            const startY = -total/2 + padSize/2;

            for (let r = 0; r < BOARD_SIZE; r++) {
                pads[r] = [];
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const x = startX + c * (padSize + gap);
                    const y = startY + r * (padSize + gap);
                    // y축 반전 (위쪽이 +y)
                    const geometry = new THREE.BoxGeometry(padSize, 0.2, padSize);
                    const material = new THREE.MeshStandardMaterial({
                        color: 0x3366cc,
                        emissive: 0x112244,
                        roughness: 0.3,
                        metalness: 0.7,
                        transparent: true,
                        opacity: 0.9,
                    });
                    const cube = new THREE.Mesh(geometry, material);
                    cube.position.set(x, y, 0);
                    cube.castShadow = true;
                    cube.receiveShadow = true;
                    cube.userData = { row: r, col: c, defaultColor: 0x3366cc, hitColor: 0x44aaff, failColor: 0xff4466, perfectColor: 0xffdd44 };
                    scene.add(cube);
                    pads[r][c] = cube;
                    padClickables.push(cube);
                }
            }

            // 바닥
            const floorGeo = new THREE.PlaneGeometry(6, 6);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0a1a, roughness: 0.8, metalness: 0.1, transparent: true, opacity: 0.6 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI/2;
            floor.position.z = -0.2;
            floor.receiveShadow = true;
            scene.add(floor);

            resizeRenderer();
            window.addEventListener('resize', resizeRenderer);
        }

        function resizeRenderer() {
            const container = document.getElementById('three-canvas');
            const w = container.clientWidth || window.innerWidth;
            const h = container.clientHeight || window.innerHeight;
            if (renderer) {
                renderer.setSize(w, h);
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
            }
        }

        // ========== 패드 하이라이트 ==========
        function setPadColor(row, col, color, duration=0) {
            if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return;
            const pad = pads[row][col];
            if (!pad) return;
            const orig = pad.userData.defaultColor;
            pad.material.color.setHex(color);
            if (duration > 0) {
                setTimeout(() => {
                    pad.material.color.setHex(orig);
                }, duration * 1000);
            }
        }

        function flashPad(row, col, color, duration=0.2) {
            setPadColor(row, col, color, duration);
        }

        // ========== 게임 로직 ==========
        function generatePattern(mode) {
            // mode: '4' or '8'
            // 4/4: 4개 패턴, 8/8: 8개 패턴
            const total = mode === '4' ? 4 : 8;
            const pattern = [];
            // 랜덤 방향: 가로, 세로, 대각선(2종), 역방향
            // 간단히: 시작점 (row, col)과 방향 벡터 (dr, dc)를 랜덤 선택
            const directions = [];
            // 가로 (오른쪽)
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c <= 0; c++) {
                    if (c+3 < 4) directions.push({dr:0, dc:1, startRow:r, startCol:c});
                }
            }
            // 세로 (아래)
            for (let c = 0; c < 4; c++) {
                for (let r = 0; r <= 0; r++) {
                    if (r+3 < 4) directions.push({dr:1, dc:0, startRow:r, startCol:c});
                }
            }
            // 대각선 (↘)
            for (let r = 0; r <= 0; r++) {
                for (let c = 0; c <= 0; c++) {
                    if (r+3 < 4 && c+3 < 4) directions.push({dr:1, dc:1, startRow:r, startCol:c});
                }
            }
            // 대각선 (↙) - 역방향은 나중에 레벨에 따라
            for (let r = 0; r <= 0; r++) {
                for (let c = 3; c <= 3; c++) {
                    if (r+3 < 4 && c-3 >= 0) directions.push({dr:1, dc:-1, startRow:r, startCol:c});
                }
            }

            // 레벨에 따라 역방향 추가 (레벨 >= 4)
            if (level >= 4) {
                // 역가로 (왼쪽)
                for (let r = 0; r < 4; r++) {
                    for (let c = 3; c <= 3; c++) {
                        if (c-3 >= 0) directions.push({dr:0, dc:-1, startRow:r, startCol:c});
                    }
                }
                // 역세로 (위)
                for (let c = 0; c < 4; c++) {
                    for (let r = 3; r <= 3; r++) {
                        if (r-3 >= 0) directions.push({dr:-1, dc:0, startRow:r, startCol:c});
                    }
                }
                // 역대각선 (↗)
                for (let r = 3; r <= 3; r++) {
                    for (let c = 0; c <= 0; c++) {
                        if (r-3 >= 0 && c+3 < 4) directions.push({dr:-1, dc:1, startRow:r, startCol:c});
                    }
                }
                // 역대각선 (↖)
                for (let r = 3; r <= 3; r++) {
                    for (let c = 3; c <= 3; c++) {
                        if (r-3 >= 0 && c-3 >= 0) directions.push({dr:-1, dc:-1, startRow:r, startCol:c});
                    }
                }
            }

            // 랜덤 선택
            const dir = directions[Math.floor(Math.random() * directions.length)];
            for (let i = 0; i < total; i++) {
                const row = dir.startRow + dir.dr * i;
                const col = dir.startCol + dir.dc * i;
                if (row < 0 || row >= 4 || col < 0 || col >= 4) {
                    // fallback
                    pattern.push({row: i%4, col: Math.floor(i/4)});
                } else {
                    pattern.push({row, col});
                }
            }
            return pattern;
        }

        // 게임 시작 (초기화)
        function startGame() {
            score = 0;
            level = 1;
            lives = 3;
            isGameOver = false;
            practiceActive = true;
            practicePhase = 0;
            isPlaying = true;
            gameoverOverlay.classList.remove('show');
            updateUI();

            // 패드 색상 초기화
            for (let r=0; r<4; r++) {
                for (let c=0; c<4; c++) {
                    pads[r][c].material.color.setHex(pads[r][c].userData.defaultColor);
                }
            }

            // 연습 시작
            startPractice();
        }

        function startPractice() {
            // 연습: a1,b1,c1 -> d1 (0,0),(1,0),(2,0) -> (3,0)
            const practicePatterns = [
                [{row:0,col:0},{row:1,col:0},{row:2,col:0},{row:3,col:0}],
                [{row:0,col:1},{row:1,col:1},{row:2,col:1},{row:3,col:1}],
                [{row:0,col:2},{row:1,col:2},{row:2,col:2},{row:3,col:2}],
                [{row:0,col:3},{row:1,col:3},{row:2,col:3},{row:3,col:3}],
            ];
            if (practicePhase >= 4) {
                practiceActive = false;
                // 본 게임 시작
                generateNewPattern();
                return;
            }
            const pat = practicePatterns[practicePhase];
            patternQueue = pat.slice(0,3); // 처음 3개는 앱이 표시
            userTargetIndex = 3; // 사용자가 누를 인덱스 (4번째)
            currentStep = 0; // 앱 표시 단계
            stepTimer = 0;
            patternStartTime = performance.now() / 1000;
            interval = 0.5;
            // 앱이 첫 3개를 순차적으로 하이라이트
            let delay = 0;
            for (let i=0; i<3; i++) {
                const p = pat[i];
                setTimeout(() => {
                    flashPad(p.row, p.col, 0x88ddff, 0.15);
                    soundTick();
                }, delay * 1000);
                delay += interval;
            }
            // 3개 후 사용자 대기
            setTimeout(() => {
                currentStep = 1; // 사용자 입력 대기
                // 사용자에게 대기 표시 (선택적으로)
            }, delay * 1000);
            // 타임아웃 처리 (너무 오래 기다리면 fail)
            // 간단히 1초 후에도 입력 없으면 fail 처리 (추후 구현)
        }

        function generateNewPattern() {
            // 본 게임 패턴 생성
            const total = gameMode === '4' ? 4 : 8;
            const pat = generatePattern(gameMode);
            patternQueue = pat;
            // 4/4: 앞 3개 앱, 마지막 1개 사용자
            // 8/8: 앞 6개 앱, 마지막 2개 사용자
            const appCount = gameMode === '4' ? 3 : 6;
            userTargetIndex = appCount;
            currentStep = 0;
            stepTimer = 0;
            patternStartTime = performance.now() / 1000;
            interval = getIntervalForLevel();

            // 앱이 순차적으로 하이라이트
            let delay = 0;
            for (let i=0; i<appCount; i++) {
                const p = pat[i];
                setTimeout(() => {
                    flashPad(p.row, p.col, 0x88ddff, 0.15);
                    soundTick();
                }, delay * 1000);
                delay += interval;
            }
            // 사용자 대기 시작
            setTimeout(() => {
                currentStep = 1;
                // 사용자 입력 대기
            }, delay * 1000);

            // 타임아웃: 너무 오래 기다리면 fail
            // (추후 구현)
        }

        function getIntervalForLevel() {
            let base = 0.5;
            let reduction = 0.15; // 15%
            if (level >= 4 && level <= 6) reduction = 0.10;
            else if (level > 6) reduction = 0.05;
            // 레벨 1은 0.5, 레벨 2는 0.425, ...
            let interval = base * Math.pow(1 - reduction, level - 1);
            if (interval < 0.15) interval = 0.15;
            return interval;
        }

        // 사용자 터치 처리
        function handlePadClick(row, col) {
            if (!isPlaying || isGameOver) return;
            if (currentStep !== 1) return; // 사용자 입력 대기 중이 아님

            // 연습 모드인지 확인
            if (practiceActive) {
                // 연습: 정확히 d1, d2, d3, d4 를 순서대로
                const expected = patternQueue[userTargetIndex];
                if (expected.row === row && expected.col === col) {
                    // 성공
                    flashPad(row, col, 0x44ff88, 0.2);
                    soundHit();
                    practicePhase++;
                    // 다음 연습으로
                    setTimeout(() => {
                        startPractice();
                    }, 300);
                } else {
                    flashPad(row, col, 0xff4466, 0.2);
                    soundFail();
                    loseLife();
                }
                return;
            }

            // 본 게임
            const expected = patternQueue[userTargetIndex];
            const now = performance.now() / 1000;
            // 마지막 앱 표시 시간을 기준으로 (간단히)
            // 여기서는 정확한 타이밍을 위해 patternStartTime + (appCount * interval) 사용
            const appCount = gameMode === '4' ? 3 : 6;
            const expectedTime = patternStartTime + (appCount * interval);
            const diff = Math.abs(now - expectedTime);

            let isPerfect = false;
            let isGood = false;
            if (diff <= perfectStrict) {
                isPerfect = true;
                isGood = true;
            } else if (diff <= perfectWindow) {
                isGood = true;
            }

            if (row === expected.row && col === expected.col && isGood) {
                // 성공
                if (isPerfect) {
                    flashPad(row, col, 0xffdd44, 0.25);
                    soundPerfect();
                    score += 20; // Perfect 보너스
                    // 금빛 파티클 효과 (간단히 반짝)
                    createSparkle(row, col);
                } else {
                    flashPad(row, col, 0x44aaff, 0.2);
                    soundHit();
                    score += 10;
                }
                updateUI();

                // 다음 패턴으로
                userTargetIndex++;
                if (userTargetIndex >= patternQueue.length) {
                    // 패턴 완료 -> 레벨업 체크
                    levelUp();
                    // 새 패턴 생성
                    setTimeout(() => {
                        generateNewPattern();
                    }, 400);
                } else {
                    // 다음 사용자 입력 대기 (이미 currentStep=1 상태 유지)
                    // 하지만 타이밍을 다시 설정해야 함? 
                    // 여기서는 간단히 바로 다음 입력을 기다리도록 함.
                    // 하지만 정확한 타이밍을 위해 약간의 딜레이?
                    // 현재는 바로 대기
                }
            } else {
                // 실패
                flashPad(row, col, 0xff4466, 0.2);
                soundFail();
                loseLife();
            }
        }

        function levelUp() {
            level++;
            updateUI();
            // 속도 증가는 getIntervalForLevel 에서 계산
        }

        function loseLife() {
            lives--;
            updateUI();
            if (lives <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            isGameOver = true;
            isPlaying = false;
            finalScoreSpan.textContent = score;
            gameoverOverlay.classList.add('show');
        }

        function updateUI() {
            scoreDisplay.textContent = score;
            levelDisplay.textContent = level;
            let hearts = '';
            for (let i=0; i<lives; i++) hearts += '❤️';
            if (lives === 0) hearts = '💔';
            livesDisplay.textContent = hearts || '💔';
        }

        // ========== 파티클 (금빛) ==========
        function createSparkle(row, col) {
            const pad = pads[row][col];
            if (!pad) return;
            const pos = pad.position.clone();
            const geometry = new THREE.BufferGeometry();
            const count = 30;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            for (let i=0; i<count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 0.2 + Math.random() * 0.5;
                const xOff = Math.cos(angle) * radius;
                const yOff = Math.sin(angle) * radius;
                positions[i*3] = pos.x + xOff;
                positions[i*3+1] = pos.y + yOff;
                positions[i*3+2] = pos.z + (Math.random() - 0.5) * 0.3;
                colors[i*3] = 1;
                colors[i*3+1] = 0.8 + Math.random() * 0.2;
                colors[i*3+2] = 0.2 + Math.random() * 0.3;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const material = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 1 });
            const particles = new THREE.Points(geometry, material);
            scene.add(particles);
            let life = 0.6;
            const interval = setInterval(() => {
                life -= 0.02;
                if (life <= 0) {
                    clearInterval(interval);
                    scene.remove(particles);
                    particles.geometry.dispose();
                    particles.material.dispose();
                } else {
                    particles.material.opacity = life;
                }
            }, 30);
        }

        // ========== 이벤트 ==========
        function setupEvents() {
            const canvas = renderer.domElement;
            // 터치
            canvas.addEventListener('touchstart', onTouch, { passive: false });
            canvas.addEventListener('mousedown', onMouseDown);

            // 모드 버튼
            mode4Btn.addEventListener('click', function() {
                gameMode = '4';
                mode4Btn.classList.add('active');
                mode8Btn.classList.remove('active');
                restartGame();
            });
            mode8Btn.addEventListener('click', function() {
                gameMode = '8';
                mode8Btn.classList.add('active');
                mode4Btn.classList.remove('active');
                restartGame();
            });

            restartBtn.addEventListener('click', function() {
                restartGame();
            });
        }

        function onTouch(e) {
            e.preventDefault();
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                const rect = renderer.domElement.getBoundingClientRect();
                const x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
                const y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
                handleRaycast(x, y);
            }
        }

        function onMouseDown(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            handleRaycast(x, y);
        }

        function handleRaycast(x, y) {
            mouse.set(x, y);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(padClickables);
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                const row = obj.userData.row;
                const col = obj.userData.col;
                if (row !== undefined && col !== undefined) {
                    handlePadClick(row, col);
                }
            }
        }

        function restartGame() {
            // 게임 재시작
            gameoverOverlay.classList.remove('show');
            startGame();
        }

        // ========== 애니메이션 루프 ==========
        function animate() {
            requestAnimationFrame(animate);
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // ========== 초기화 ==========
        function init() {
            initThree();
            setupEvents();
            startGame();
            animate();
            // 창 크기 변경 시
            window.addEventListener('resize', resizeRenderer);
        }

        // DOM 로드 후 실행
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
</script>
</body>
</html>
