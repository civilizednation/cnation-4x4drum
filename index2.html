<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>cnation-4x4drum</title>
<style>
body {
margin: 0;
padding: 0;
overflow: hidden;
background-color: #111;
font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
user-select: none;
touch-action: none;
}
#cnation-canvas-container {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
}
#cnation-ui-layer {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
display: flex;
flex-direction: column;
justify-content: space-between;
}
#cnation-hud {
display: none;
justify-content: space-between;
padding: 20px;
color: white;
font-size: 24px;
font-weight: bold;
text-shadow: 2px 2px 4px #000;
}
#cnation-title-screen {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.85);
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
pointer-events: auto;
}
h1 {
color: #fff;
font-size: 48px;
margin-bottom: 50px;
font-weight: bold;
text-shadow: 0 0 10px #0088ff;
}
.cnation-btn {
background: #333;
color: #fff;
border: 2px solid #0088ff;
padding: 15px 40px;
font-size: 24px;
font-weight: bold;
border-radius: 10px;
margin: 10px;
font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
cursor: pointer;
}
.cnation-btn:active {
background: #0088ff;
}
#cnation-footer {
position: absolute;
bottom: 20px;
width: 100%;
display: flex;
justify-content: space-between;
padding: 0 20px;
box-sizing: border-box;
color: #aaa;
font-size: 16px;
font-weight: bold;
}
#cnation-message {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
color: #fff;
font-size: 36px;
font-weight: bold;
text-shadow: 2px 2px 5px #000;
display: none;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="cnation-canvas-container"></div>

<div id="cnation-ui-layer">
<div id="cnation-hud">
<div id="cnation-score-disp">Score: 0</div>
<div id="cnation-level-disp">Level: 1</div>
<div id="cnation-life-disp">Life: 3</div>
</div>
</div>

<div id="cnation-message"></div>

<div id="cnation-title-screen">
<h1>cnation-4x4drum</h1>
<button class="cnation-btn" id="cnation-btn-44">4/4 박자 모드 (Beta)</button>
<button class="cnation-btn" id="cnation-btn-88">8/8 박자 모드 (Beta)</button>
<div id="cnation-footer">
<span></span>
<span>제작자 : cnation(문명국)</span>
<span>Beta 1.0</span>
</div>
</div>

<script>
// 시스템 변수
let cnation_audioCtx;
let cnation_scene, cnation_camera, cnation_renderer, cnation_raycaster;
let cnation_pads = [];
let cnation_particles = [];

// 게임 상태 변수
let cnation_gameState = 'title'; // title, practice, playing, gameover
let cnation_mode = 4; // 4 or 8
let cnation_score = 0;
let cnation_level = 1;
let cnation_life = 3;
let cnation_interval = 0.5; // 시작 간격 0.5초

let cnation_sequence = [];
let cnation_stepIndex = 0;
let cnation_isUserTurn = false;
let cnation_nextBeatTime = 0;
let cnation_practiceCount = 0;
let cnation_tapsInLevel = 0;
let cnation_expectedUserTaps = 0;
let cnation_currentUserTaps = 0;

// 초기화 함수
function cnation_init() {
cnation_initThreeJS();
cnation_initAudio();
cnation_bindEvents();
cnation_animate();
}

function cnation_initThreeJS() {
const container = document.getElementById('cnation-canvas-container');
cnation_scene = new THREE.Scene();
cnation_camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
cnation_camera.position.set(0, -2, 6);
cnation_camera.lookAt(0, 0, 0);

cnation_renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
cnation_renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(cnation_renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
cnation_scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(0, 10, 10);
cnation_scene.add(dirLight);

const padGeometry = new THREE.BoxGeometry(0.8, 0.8, 0.2);
const spacing = 1.0;
const offsetX = -1.5 * spacing;
const offsetY = 1.5 * spacing;

// 패드 생성 (4x4)
for (let row = 0; row < 4; row++) {
for (let col = 0; col < 4; col++) {
const material = new THREE.MeshPhongMaterial({ color: 0x444444, shininess: 100 });
const pad = new THREE.Mesh(padGeometry, material);
pad.position.set(offsetX + col * spacing, offsetY - row * spacing, 0);
pad.userData = { id: row * 4 + col, row: row, col: col, baseColor: 0x444444 };
cnation_scene.add(pad);
cnation_pads.push(pad);
}
}
cnation_raycaster = new THREE.Raycaster();
}

function cnation_initAudio() {
const AudioContext = window.AudioContext || window.webkitAudioContext;
cnation_audioCtx = new AudioContext();
}

function cnation_playSound(type) {
if (!cnation_audioCtx) return;
const osc = cnation_audioCtx.createOscillator();
const gain = cnation_audioCtx.createGain();
osc.connect(gain);
gain.connect(cnation_audioCtx.destination);

const now = cnation_audioCtx.currentTime;
if (type === 'app') {
osc.type = 'sine';
osc.frequency.setValueAtTime(600, now);
gain.gain.setValueAtTime(0.5, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
osc.start(now); osc.stop(now + 0.1);
} else if (type === 'user') {
osc.type = 'square';
osc.frequency.setValueAtTime(800, now);
gain.gain.setValueAtTime(0.8, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
osc.start(now); osc.stop(now + 0.1);
} else if (type === 'success') {
osc.type = 'sine';
osc.frequency.setValueAtTime(1200, now);
gain.gain.setValueAtTime(0.6, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
osc.start(now); osc.stop(now + 0.2);
} else if (type === 'fail') {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(150, now);
gain.gain.setValueAtTime(0.8, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
osc.start(now); osc.stop(now + 0.3);
}
}

function cnation_bindEvents() {
document.getElementById('cnation-btn-44').addEventListener('click', () => cnation_startGame(4));
document.getElementById('cnation-btn-88').addEventListener('click', () => cnation_startGame(8));
window.addEventListener('resize', () => {
cnation_camera.aspect = window.innerWidth / window.innerHeight;
cnation_camera.updateProjectionMatrix();
cnation_renderer.setSize(window.innerWidth, window.innerHeight);
});

const canvas = cnation_renderer.domElement;
canvas.addEventListener('pointerdown', cnation_handleTouch);
}

function cnation_startGame(mode) {
if (cnation_audioCtx.state === 'suspended') cnation_audioCtx.resume();
cnation_mode = mode;
cnation_interval = mode === 8 ? 0.3 : 0.5;
cnation_score = 0;
cnation_level = 1;
cnation_life = 3;
cnation_practiceCount = 0;
cnation_tapsInLevel = 0;
document.getElementById('cnation-title-screen').style.display = 'none';
document.getElementById('cnation-hud').style.display = 'flex';
cnation_updateHUD();
cnation_gameState = 'practice';
cnation_showMessage("연습 모드 시작");
setTimeout(cnation_startNextSequence, 1500);
}

function cnation_updateHUD() {
document.getElementById('cnation-score-disp').innerText = `Score: ${cnation_score}`;
document.getElementById('cnation-level-disp').innerText = `Level: ${cnation_level}`;
document.getElementById('cnation-life-disp').innerText = `Life: ${cnation_life}`;
}

function cnation_showMessage(msg) {
const el = document.getElementById('cnation-message');
el.innerText = msg;
el.style.display = 'block';
setTimeout(() => { el.style.display = 'none'; }, 1000);
}

function cnation_createParticles(position) {
const particleGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
const particleMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
for (let i = 0; i < 15; i++) {
const p = new THREE.Mesh(particleGeo, particleMat);
p.position.copy(position);
p.userData = {
vx: (Math.random() - 0.5) * 0.1,
vy: Math.random() * 0.1 + 0.05,
vz: (Math.random() - 0.5) * 0.1,
life: 1.0
};
cnation_scene.add(p);
cnation_particles.push(p);
}
}

function cnation_flashPad(padId, colorHex) {
const pad = cnation_pads[padId];
pad.material.color.setHex(colorHex);
setTimeout(() => {
if(pad) pad.material.color.setHex(pad.userData.baseColor);
}, 200);
}

function cnation_generatePattern() {
let pattern = [];
const steps = cnation_mode; 
const isReverse = cnation_level >= 4 && Math.random() > 0.5;
const allowDiagonal = cnation_level >= 2;

let type = Math.floor(Math.random() * (allowDiagonal ? 3 : 2)); 
// 0: 가로, 1: 세로, 2: 대각선

if (type === 0) {
const row = Math.floor(Math.random() * 4);
for(let i=0; i<4; i++) pattern.push(row * 4 + i);
if(cnation_mode === 8) {
const row2 = (row + 1) % 4;
for(let i=0; i<4; i++) pattern.push(row2 * 4 + i);
}
} else if (type === 1) {
const col = Math.floor(Math.random() * 4);
for(let i=0; i<4; i++) pattern.push(i * 4 + col);
if(cnation_mode === 8) {
const col2 = (col + 1) % 4;
for(let i=0; i<4; i++) pattern.push(i * 4 + col2);
}
} else {
// 대각선 (0,0 -> 3,3) 또는 (0,3 -> 3,0)
const diagType = Math.random() > 0.5 ? 1 : 2;
if(diagType === 1) {
pattern = [0, 5, 10, 15];
if(cnation_mode === 8) pattern = pattern.concat([3, 6, 9, 12]); // 엑스자 교차
} else {
pattern = [3, 6, 9, 12];
if(cnation_mode === 8) pattern = pattern.concat([0, 5, 10, 15]);
}
}

if(isReverse) pattern.reverse();
return pattern;
}

function cnation_startNextSequence() {
if (cnation_gameState === 'gameover') return;

if (cnation_gameState === 'practice') {
// 연습 4번: a1-d1, a2-d2, a3-d3, a4-d4
cnation_sequence = [
0 + cnation_practiceCount, 
4 + cnation_practiceCount, 
8 + cnation_practiceCount, 
12 + cnation_practiceCount
];
if(cnation_mode === 8) {
// 8박자 연습 패턴 임시 생성 (단순 반복)
cnation_sequence = cnation_sequence.concat(cnation_sequence);
}
} else {
cnation_sequence = cnation_generatePattern();
}

cnation_stepIndex = 0;
cnation_isUserTurn = false;
cnation_currentUserTaps = 0;
cnation_expectedUserTaps = cnation_mode === 4 ? 1 : 2;

cnation_nextBeatTime = cnation_audioCtx.currentTime + 0.5;
cnation_scheduleAppBeats();
}

function cnation_scheduleAppBeats() {
const appSteps = cnation_mode === 4 ? 3 : 6;

function playStep() {
if (cnation_gameState === 'gameover') return;

if (cnation_stepIndex < appSteps) {
const padId = cnation_sequence[cnation_stepIndex];
cnation_playSound('app');
cnation_flashPad(padId, 0xffffff);
cnation_stepIndex++;
setTimeout(playStep, cnation_interval * 1000);
} else {
cnation_isUserTurn = true;
// 유저 입력 대기 시간 설정 (다음 박자)
cnation_nextBeatTime = cnation_audioCtx.currentTime + cnation_interval;
}
}
playStep();
}

function cnation_handleTouch(event) {
if (!cnation_isUserTurn || cnation_gameState === 'gameover') return;

const mouse = new THREE.Vector2();
if(event.changedTouches) {
mouse.x = (event.changedTouches[0].clientX / window.innerWidth) * 2 - 1;
mouse.y = -(event.changedTouches[0].clientY / window.innerHeight) * 2 + 1;
} else {
mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
}

cnation_raycaster.setFromCamera(mouse, cnation_camera);
const intersects = cnation_raycaster.intersectObjects(cnation_pads);

if (intersects.length > 0) {
const padId = intersects[0].object.userData.id;
cnation_processUserTap(padId, intersects[0].object.position);
}
}

function cnation_processUserTap(padId, position) {
cnation_playSound('user');
const appSteps = cnation_mode === 4 ? 3 : 6;
const expectedPadId = cnation_sequence[appSteps + cnation_currentUserTaps];
const timeDiff = Math.abs(cnation_audioCtx.currentTime - cnation_nextBeatTime);

if (padId === expectedPadId) {
if (timeDiff <= 0.05) {
// Perfect
cnation_flashPad(padId, 0xffd700);
cnation_createParticles(position);
cnation_playSound('success');
cnation_score += 15; 
} else if (timeDiff <= 0.20) {
// Pass
cnation_flashPad(padId, 0x0088ff);
cnation_playSound('success');
cnation_score += 10;
} else {
// Fail - 타이밍 안맞음
cnation_handleFail(padId);
return;
}
} else {
// Fail - 잘못된 패드
cnation_handleFail(padId);
return;
}

cnation_updateHUD();
cnation_currentUserTaps++;

if (cnation_currentUserTaps >= cnation_expectedUserTaps) {
cnation_isUserTurn = false;
cnation_sequenceComplete();
} else {
cnation_nextBeatTime += cnation_interval;
}
}

function cnation_handleFail(padId) {
cnation_flashPad(padId, 0xff0000);
cnation_playSound('fail');
cnation_life--;
cnation_updateHUD();
cnation_isUserTurn = false;

if (cnation_life <= 0) {
cnation_gameState = 'gameover';
cnation_showMessage("GAME OVER");
setTimeout(() => {
document.getElementById('cnation-title-screen').style.display = 'flex';
document.getElementById('cnation-hud').style.display = 'none';
}, 2000);
} else {
setTimeout(cnation_startNextSequence, 1000);
}
}

function cnation_sequenceComplete() {
if (cnation_gameState === 'practice') {
cnation_practiceCount++;
if (cnation_practiceCount >= 4) {
cnation_gameState = 'playing';
cnation_showMessage("본 게임 시작!");
setTimeout(cnation_startNextSequence, 1500);
} else {
setTimeout(cnation_startNextSequence, 1000);
}
} else {
cnation_tapsInLevel++;
if (cnation_tapsInLevel >= 5) {
cnation_levelUp();
} else {
setTimeout(cnation_startNextSequence, 1000);
}
}
}

function cnation_levelUp() {
cnation_level++;
cnation_tapsInLevel = 0;
cnation_showMessage(`Level ${cnation_level}`);

if (cnation_level <= 3) {
cnation_interval *= 0.85; // 15% 감소(속도증가)
} else if (cnation_level <= 6) {
cnation_interval *= 0.90; // 10% 감소
} else {
cnation_interval *= 0.95; // 5% 감소
}

cnation_updateHUD();
setTimeout(cnation_startNextSequence, 1500);
}

function cnation_animate() {
requestAnimationFrame(cnation_animate);

// 파티클 애니메이션
for (let i = cnation_particles.length - 1; i >= 0; i--) {
const p = cnation_particles[i];
p.position.x += p.userData.vx;
p.position.y += p.userData.vy;
p.position.z += p.userData.vz;
p.userData.life -= 0.05;
p.material.opacity = p.userData.life;
p.material.transparent = true;
if (p.userData.life <= 0) {
cnation_scene.remove(p);
cnation_particles.splice(i, 1);
}
}

cnation_renderer.render(cnation_scene, cnation_camera);
}

window.onload = cnation_init;
</script>
</body>
</html>
