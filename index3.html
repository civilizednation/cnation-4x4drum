<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cnation-4x4drum Beta</title>
    <style>
        /* --- 전역 스타일 및 폰트 설정 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body { 
            overflow: hidden; 
            background-color: #121212; 
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; 
            color: #fff;
        }
        
        /* --- UI 레이아웃 --- */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .top-bar { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; font-size: 14px; opacity: 0.8; }
        
        /* --- 게임 오버 / 시작 오버레이 --- */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 20; pointer-events: auto;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        #overlay h1 { font-size: 36px; margin-bottom: 10px; color: #4da6ff; }
        #overlay p { font-size: 18px; margin-bottom: 30px; line-height: 1.5; }
        #start-btn {
            padding: 15px 40px; font-size: 24px; font-weight: bold; font-family: 'Malgun Gothic', sans-serif;
            background: #4da6ff; border: none; border-radius: 10px; color: #fff; cursor: pointer;
            box-shadow: 0 4px 15px rgba(77, 166, 255, 0.4); transition: transform 0.1s;
        }
        #start-btn:active { transform: scale(0.95); }

        /* --- Three.js 캔버스 --- */
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- UI 오버레이 -->
    <div id="ui-layer">
        <div class="top-bar">
            <span id="score-display">점수: 0</span>
            <span id="level-display">레벨: 1</span>
            <span id="hp-display">생명: 3</span>
        </div>
        <div class="bottom-bar">
            <span>v0.1 Beta</span>
            <span>제작자: cnation(문명국)</span>
        </div>
    </div>

    <!-- 시작/게임오버 화면 -->
    <div id="overlay">
        <h1>cnation-4x4drum</h1>
        <p>앱이 보여주는 3개의 리듬을 기억하고 4번째 패드를 박자에 맞춰 터치하세요! (연습 4회 후 본격 게임 시작)</p>
        <button id="start-btn">게임 시작</button>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        /* =========================================
           1. 오디오 시스템 (Web Audio API)
           ========================================= */
        const AudioSys = {
            ctx: null,
            init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playTone(freq, type, duration, volume = 0.5) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            playAppTick() { this.playTone(800, 'sine', 0.05, 0.3); }, // 틱틱틱 (앱)
            playUserTap() { this.playTone(1000, 'triangle', 0.08, 0.5); }, // 틱! (유저)
            playSuccess() { this.playTone(1200, 'sine', 0.15, 0.6); }, // 성공음
            playFail() { this.playTone(200, 'sawtooth', 0.2, 0.4); }  // 실패음
        };

        /* =========================================
           2. 게임 상태 및 설정
           ========================================= */
        const GameState = {
            phase: 'IDLE', // IDLE, PRACTICE, PLAYING, GAMEOVER
            score: 0,
            level: 1,
            hp: 3,
            baseInterval: 500, // 4/4박자 기준(ms)
            currentInterval: 500,
            perfectWindow: 50, // Perfect 판정 (±0.05초)
            passWindow: 200,   // 일반 Pass 판정 (±0.2초)
            
            // 8/8박자 모드 관련 (나중 확장용)
            mode: '4/4', 
            userTurnsInLevel: 0,
            requiredTurnsForLevelUp: 5,
            
            // 시퀀스 관리
            sequence: [],
            currentStep: 0,
            nextTargetTime: 0,
            waitingForUser: false,
            userTargetPad: null,
            
            // 난이도 및 규칙 풀
            rulesPool: [],
            currentRuleIndex: 0
        };

        /* =========================================
           3. Three.js 3D 패드 렌더링
           ========================================= */
        let scene, camera, renderer, pads = {};
        const padColors = {
            default: 0x333333,
            appActive: 0x4da6ff, // 밝은 파랑
            userPerfect: 0xffd700, // 골드
            userSuccess: 0x00aaff, // 밝은 파랑
            userFail: 0xff3333   // 밝은 빨강
        };

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 7, 5);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 조명
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // 4x4 패드 생성
            const geometry = new THREE.BoxGeometry(0.9, 0.2, 0.9);
            const rows = ['a', 'b', 'c', 'd'];
            
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const material = new THREE.MeshStandardMaterial({ color: padColors.default, roughness: 0.4, metalness: 0.6 });
                    const mesh = new THREE.Mesh(geometry, material);
                    
                    // 중앙 정렬을 위한 위치 계산
                    mesh.position.x = (c - 1.5) * 1.1;
                    mesh.position.z = (r - 1.5) * 1.1;
                    mesh.position.y = 0;
                    
                    const id = `${rows[r]}${c + 1}`;
                    mesh.userData = { id: id, baseY: 0 };
                    scene.add(mesh);
                    pads[id] = mesh;
                }
            }
            
            animate();
        }

        // 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            // 패드 색상 및 위치 자연스러운 복원 로직은 Tween으로 처리하는 것이 좋으나, 
            // 단일파일轻量화를 위해 여기서는 상태에 따라 직접 제어합니다.
            renderer.render(scene, camera);
        }

        // 패드 시각적 피드백
        function flashPad(padId, colorHex, isPerfect = false) {
            const pad = pads[padId];
            if (!pad) return;
            
            pad.material.color.setHex(colorHex);
            pad.position.y = isPerfect ? 0.4 : 0.2; // Perfect일 때 더 높이 튀김
            
            // 골드 이펙트 (금빛 날림)
            if (isPerfect) {
                pad.material.emissive = new THREE.Color(0xffd700);
                pad.material.emissiveIntensity = 0.8;
            }

            setTimeout(() => {
                pad.material.color.setHex(padColors.default);
                pad.position.y = pad.userData.baseY;
                if (isPerfect) {
                    pad.material.emissive = new THREE.Color(0x000000);
                    pad.material.emissiveIntensity = 0;
                }
            }, 150);
        }

        /* =========================================
           4. 게임 로직 및 규칙 생성기
           ========================================= */
        const Rules = {
            generateRule(level) {
                const rows = ['a', 'b', 'c', 'd'];
                const cols = [1, 2, 3, 4];
                let rule = [];

                // 레벨 2+ : 대각선 등장
                const useDiagonal = level >= 2 && Math.random() > 0.5;
                // 레벨 4+ : 역방향 등장
                const useReverse = level >= 4 && Math.random() > 0.5;

                if (useDiagonal) {
                    // 정방향 대각선 또는 X자 엇갈린 대각선
                    const isXShape = Math.random() > 0.5;
                    if (isXShape) {
                        rule = ['a4', 'b3', 'c2', 'd1']; // 예시 X자
                    } else {
                        rule = ['a1', 'b2', 'c3', 'd4'];
                    }
                    if (useReverse) rule = rule.reverse();
                } else {
                    // 가로, 세로 규칙
                    const isHorizontal = Math.random() > 0.5;
                    const idx = Math.floor(Math.random() * 4);
                    
                    if (isHorizontal) {
                        rule = rows.map(r => `${r}${idx + 1}`);
                    } else {
                        rule = cols.map(c => `${rows[idx]}${c}`);
                    }
                    if (useReverse) rule = rule.reverse();
                }
                
                return rule;
            }
        };

        /* =========================================
           5. 메인 게임 컨트롤러
           ========================================= */
        const Game = {
            timerId: null,

            start() {
                AudioSys.init();
                GameState.score = 0;
                GameState.level = 1;
                GameState.hp = 3;
                GameState.userTurnsInLevel = 0;
                GameState.currentInterval = GameState.baseInterval;
                this.updateUI();
                
                document.getElementById('overlay').style.display = 'none';
                GameState.phase = 'PRACTICE';
                
                // 연습 모드: a1~d1, a2~d2 ... 순서대로 4번
                this.runPractice(1);
            },

            runPractice(count) {
                if (count > 4) {
                    GameState.phase = 'PLAYING';
                    this.startLevel();
                    return;
                }
                
                const rows = ['a', 'b', 'c', 'd'];
                const seq = rows.map(r => `${r}${count}`);
                
                // 앱이 3개 찍고 유저가 4번째
                this.executeSequence(seq.slice(0, 3), true, () => {
                    GameState.waitingForUser = true;
                    GameState.userTargetPad = seq[3];
                    GameState.nextTargetTime = performance.now() + GameState.currentInterval;
                });
            },

            startLevel() {
                // 새 레벨 규칙 생성
                GameState.sequence = Rules.generateRule(GameState.level);
                GameState.currentStep = 0;
                GameState.waitingForUser = false;
                
                this.playNextStep();
            },

            playNextStep() {
                if (GameState.hp <= 0) { this.gameOver(); return; }

                const seq = GameState.sequence;
                const step = GameState.currentStep;

                if (step < 3) {
                    // 앱 턴: 3개까지 찍음
                    flashPad(seq[step], padColors.appActive);
                    AudioSys.playAppTick();
                    GameState.currentStep++;
                    
                    this.timerId = setTimeout(() => this.playNextStep(), GameState.currentInterval);
                } else if (step === 3) {
                    // 유저 턴 대기
                    GameState.waitingForUser = true;
                    GameState.userTargetPad = seq[3];
                    GameState.nextTargetTime = performance.now() + GameState.currentInterval;
                    
                    // 만약 유저가 안 누르고 시간이 지나면 Fail 처리 (간단한 미스 판정)
                    // 실제 리듬게임은 타이밍 윈도우를 체크하지만, 여기서는 단순 타임아웃으로 처리
                    this.timerId = setTimeout(() => {
                        if (GameState.waitingForUser) {
                            this.handleUserInput(null); // 타임아웃 = 실수
                        }
                    }, GameState.currentInterval + GameState.passWindow + 50);
                }
            },

            handleTouch(padId) {
                if (!GameState.waitingForUser) return;
                
                clearTimeout(this.timerId); // 타임아웃 타이머 취소
                const now = performance.now();
                const diff = Math.abs(now - GameState.nextTargetTime);
                
                this.handleUserInput(padId, diff);
            },

            handleUserInput(padId, timeDiff = 9999) {
                GameState.waitingForUser = false;
                const target = GameState.userTargetPad;
                
                // 1. 타겟 패드인지 확인
                // 2. 타이밍 확인 (Perfect / Pass / Fail)
                let isCorrectPad = (padId === target);
                let isPerfect = isCorrectPad && timeDiff <= GameState.perfectWindow;
                let isPass = isCorrectPad && timeDiff <= GameState.passWindow;

                if (isPerfect) {
                    flashPad(target, padColors.userPerfect, true);
                    AudioSys.playSuccess();
                    GameState.score += 10;
                } else if (isPass) {
                    flashPad(target, padColors.userSuccess);
                    AudioSys.playSuccess();
                    GameState.score += 10;
                } else {
                    // 잘못된 패드 또는 타이밍 실패
                    const failPad = isCorrectPad ? target : padId;
                    flashPad(failPad, padColors.userFail);
                    AudioSys.playFail();
                    GameState.hp--;
                }

                this.updateUI();
                
                if (GameState.hp <= 0) {
                    this.gameOver();
                } else {
                    // 레벨업 체크
                    GameState.userTurnsInLevel++;
                    if (GameState.userTurnsInLevel >= GameState.requiredTurnsForLevelUp) {
                        this.levelUp();
                    } else {
                        // 다음 시퀀스로
                        GameState.currentStep = 0;
                        GameState.sequence = Rules.generateRule(GameState.level);
                        this.timerId = setTimeout(() => this.playNextStep(), GameState.currentInterval);
                    }
                }
            },

            levelUp() {
                GameState.level++;
                GameState.userTurnsInLevel = 0;
                
                // 난이도별 속도 증가율 적용
                let speedMultiplier = 1.15; // 기본 15% 감소
                if (GameState.level > 6) speedMultiplier = 1.05;      // 5% 증가
                else if (GameState.level > 3) speedMultiplier = 1.10; // 10% 증가
                
                GameState.currentInterval *= speedMultiplier;
                
                // 레벨업 사운드/효과 (간단히)
                AudioSys.playTone(1500, 'sine', 0.3, 0.5);
                this.updateUI();
                
                // 다음 레벨 시작
                this.startLevel();
            },

            gameOver() {
                GameState.phase = 'GAMEOVER';
                const overlay = document.getElementById('overlay');
                overlay.style.display = 'flex';
                overlay.querySelector('h1').innerText = "GAME OVER";
                overlay.querySelector('p').innerHTML = `최종 점수: ${GameState.score} 도달 레벨: ${GameState.level}`;
                document.getElementById('start-btn').innerText = "다시 시작";
            },

            updateUI() {
                document.getElementById('score-display').innerText = `점수: ${GameState.score}`;
                document.getElementById('level-display').innerText = `레벨: ${GameState.level}`;
                document.getElementById('hp-display').innerText = `생명: ${GameState.hp}`;
            }
        };

        /* =========================================
           6. 이벤트 리스너 및 초기화
           ========================================= */
        window.onload = () => {
            initThreeJS();
            
            // 터치/클릭 이벤트 매핑
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            function onPointerDown(event) {
                event.preventDefault();
                if (GameState.phase !== 'PRACTICE' && GameState.phase !== 'PLAYING') return;

                const rect = renderer.domElement.getBoundingClientRect();
                const clientX = event.touches ? event.touches[0].clientX : event.clientX;
                const clientY = event.touches ? event.touches[0].clientY : event.clientY;
                
                mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(Object.values(pads));

                if (intersects.length > 0) {
                    const padId = intersects[0].object.userData.id;
                    AudioSys.playUserTap(); // 기본 터치음
                    Game.handleTouch(padId);
                }
            }

            renderer.domElement.addEventListener('mousedown', onPointerDown);
            renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: false });

            // 시작 버튼
            document.getElementById('start-btn').addEventListener('click', () => Game.start());
            
            // 창 크기 조절 대응
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };
    </script>
</body>
</html>
