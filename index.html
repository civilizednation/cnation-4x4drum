<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>cnation-4x4drum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#120d1e;
    --bg-2:#1d1730;
    --panel:#211a35;
    --panel-edge:#3a2c5c;
    --violet-glow:#7a5cf0;
    --text-1:#f2ecff;
    --text-dim:#9686b8;
    --accent-success:#42e5ff;
    --accent-fail:#ff4763;
    --accent-guide:#ffcb57;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, #2a2050 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color:var(--text-1);
    font-family:'JetBrains Mono', monospace;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  #app{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    padding-top:calc(var(--safe-top) + 10px);
    padding-bottom:calc(var(--safe-bottom) + 10px);
  }

  /* ---------- status bar ---------- */
  #statusBar{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 18px;
    gap:10px;
  }
  .stat{ display:flex; flex-direction:column; align-items:center; min-width:64px; }
  .stat .label{
    font-family:'Unbounded', sans-serif;
    font-size:9px; font-weight:700; letter-spacing:.12em;
    color:var(--text-dim); text-transform:uppercase;
  }
  .stat .value{
    font-size:20px; font-weight:700; color:var(--text-1);
    margin-top:2px;
  }
  #livesWrap{ display:flex; gap:5px; margin-top:4px; }
  .heart{ font-size:15px; filter:drop-shadow(0 0 4px rgba(255,71,99,.5)); transition:opacity .2s, transform .2s; }
  .heart.dead{ opacity:.18; transform:scale(.8); filter:none; }
  #titleTag{
    font-family:'Unbounded', sans-serif; font-weight:900; font-size:12px;
    letter-spacing:.06em; color:var(--text-1); text-align:center;
  }
  #titleTag span{ display:block; font-size:9px; font-weight:500; color:var(--text-dim); letter-spacing:.15em; margin-top:2px; }

  /* ---------- stage ---------- */
  #stage{
    position:relative;
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
  }
  #stageInner{
    position:relative;
    width:min(92vw, 92vh, 460px);
    aspect-ratio:1/1;
  }
  #beatRing{
    position:absolute; inset:0; margin:auto;
    width:60%; height:60%;
    border-radius:50%;
    border:2px solid rgba(122,92,240,.35);
    opacity:0;
    pointer-events:none;
  }
  #beatRing.pulse{ animation:beatPulse .55s ease-out; }
  @keyframes beatPulse{
    0%{ transform:scale(.72); opacity:.75; border-color:rgba(255,203,87,.55); }
    100%{ transform:scale(1.28); opacity:0; border-color:rgba(122,92,240,0); }
  }
  #gameCanvas{
    position:relative; z-index:1;
    width:100%; height:100%;
    display:block;
    border-radius:22px;
  }
  #centerLabel{
    position:absolute; left:0; right:0; top:-38px;
    text-align:center;
    font-family:'Unbounded', sans-serif;
    font-weight:700; font-size:12px; letter-spacing:.1em;
    color:var(--accent-guide);
    text-transform:uppercase;
    min-height:16px;
    opacity:0; transition:opacity .25s;
  }
  #centerLabel.show{ opacity:1; }

  /* ---------- footer hint ---------- */
  #hint{
    flex:0 0 auto;
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    padding:6px 20px 0;
    letter-spacing:.02em;
  }

  /* ---------- overlays ---------- */
  .overlay{
    position:absolute; inset:0;
    background:rgba(10,7,20,.86);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    text-align:center;
    z-index:10;
    padding:24px;
  }
  .overlay h1{
    font-family:'Unbounded', sans-serif; font-size:26px; font-weight:900;
    margin:0 0 6px; letter-spacing:.02em;
  }
  .overlay p{ color:var(--text-dim); font-size:13px; line-height:1.7; max-width:320px; margin:0 0 22px; }
  .btn{
    font-family:'Unbounded', sans-serif;
    background:linear-gradient(135deg, #7a5cf0, #42e5ff);
    color:#0c0a16;
    border:none; border-radius:999px;
    padding:14px 34px;
    font-size:13px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(122,92,240,.4);
  }
  .btn:active{ transform:scale(.96); }
  #gameOverOverlay .finalScore{
    font-family:'Unbounded', sans-serif; font-size:44px; font-weight:900;
    background:linear-gradient(135deg,#42e5ff,#7a5cf0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:4px;
  }
  #gameOverOverlay .finalLevel{ font-size:12px; color:var(--text-dim); margin-bottom:22px; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div id="app">

  <div id="statusBar">
    <div class="stat">
      <div class="label">Score</div>
      <div class="value" id="scoreVal">0</div>
    </div>
    <div id="titleTag">4x4 DRUM<span>cnation beta</span></div>
    <div class="stat">
      <div class="label">Level</div>
      <div class="value" id="levelVal">1</div>
    </div>
  </div>

  <div style="display:flex;justify-content:center;">
    <div id="livesWrap">
      <span class="heart" data-i="0">❤</span>
      <span class="heart" data-i="1">❤</span>
      <span class="heart" data-i="2">❤</span>
    </div>
  </div>

  <div id="stage">
    <div id="stageInner">
      <div id="centerLabel">Practice 1 / 4</div>
      <div id="beatRing"></div>
      <canvas id="gameCanvas"></canvas>
    </div>
  </div>

  <div id="hint">패드가 순서대로 켜지는 리듬을 보고, 이어지는 4번째 칸을 타이밍에 맞춰 터치하세요</div>

  <div class="overlay" id="startOverlay">
    <h1>4×4 DRUM</h1>
    <p>3개의 패드가 규칙적으로 먼저 켜집니다.<br>같은 박자로 이어지는 4번째 패드를 터치하세요.<br>정확히 맞히면 점수, 틀리면 생명이 줄어듭니다.</p>
    <button class="btn" id="startBtn">게임 시작</button>
  </div>

  <div class="overlay" id="gameOverOverlay" hidden>
    <h1>Game Over</h1>
    <div class="finalScore" id="finalScoreVal">0</div>
    <div class="finalLevel" id="finalLevelVal">LEVEL 1 에서 종료</div>
    <button class="btn" id="retryBtn">다시 시작</button>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  'use strict';

  /* =========================================================
     0. 상수 / 상태
  ========================================================= */
  const ROWS = ['a','b','c','d'];
  const COLS = [1,2,3,4];
  const HIT_WINDOW = 200;          // ms, 정확 타이밍 기준 앞뒤 허용치
  const BASE_INTERVAL = 500;       // ms, 레벨1 박자 간격
  const SPEED_UP_FACTOR = 0.8;     // 레벨업 시 간격 * 0.8 (20% 빨라짐)
  const SUCCESS_PER_LEVEL = 5;     // 본게임에서 5회 성공마다 레벨업
  const ROUND_GAP = 550;           // ms, 라운드 사이 여백

  const COLOR_BASE      = 0x2c2447;
  const COLOR_BASE_TOP  = 0x362a58;
  const COLOR_SUCCESS   = 0x42e5ff;
  const COLOR_FAIL      = 0xff4763;
  const COLOR_GUIDE     = 0xffcb57;

  let state = 'idle'; // idle | practice | playing | gameover
  let score = 0, level = 1, lives = 3;
  let currentInterval = BASE_INTERVAL;
  let successCount = 0;
  let practiceIndex = 0;
  let currentRound = null;
  let waitingForUser = false;
  let roundTimer = null;

  const PRACTICE_PATTERNS = COLS.map(c => ({
    seq: ['a'+c, 'b'+c, 'c'+c],
    target: 'd'+c
  }));

  const MAIN_PATTERNS = [
    ...ROWS.map(r => ({ seq:[r+'1', r+'2', r+'3'], target:r+'4' })),
    ...COLS.map(c => ({ seq:['a'+c,'b'+c,'c'+c], target:'d'+c }))
  ];
  let lastPatternKey = null;

  function pickMainPattern(){
    let p;
    do { p = MAIN_PATTERNS[Math.floor(Math.random()*MAIN_PATTERNS.length)]; }
    while (MAIN_PATTERNS.length > 1 && p.target === lastPatternKey);
    lastPatternKey = p.target;
    return p;
  }

  /* =========================================================
     1. Web Audio - 내장 효과음 (외부 음원 없이 합성)
  ========================================================= */
  let actx = null;
  function ensureAudio(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }
  function tone(freq, dur, type, peak, delay){
    if (!actx) return;
    const t0 = actx.currentTime + (delay||0);
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peak, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  // 앱이 먼저 찍어주는 안내 박자음 "틱틱틱"
  function playGuideTick(){ tone(760, 0.09, 'sine', 0.16); }
  // 유저가 터치하는 순간 나는 조금 더 강한 "틱!"
  function playUserTick(){ tone(1100, 0.07, 'square', 0.22); }
  // 타이밍/위치 성공 사운드 (경쾌한 상승 2음)
  function playSuccessSound(){ tone(1180, 0.09, 'sine', 0.2); tone(1580, 0.12, 'sine', 0.2, 0.06); }
  // 실패 사운드 (짧고 거친 하강음)
  function playFailSound(){ tone(220, 0.18, 'sawtooth', 0.18); tone(140, 0.2, 'sawtooth', 0.14, 0.05); }
  // 레벨업 팡파레
  function playLevelUpSound(){ tone(660,0.1,'triangle',0.2); tone(880,0.1,'triangle',0.2,0.09); tone(1320,0.18,'triangle',0.22,0.18); }

  /* =========================================================
     2. THREE.js 씬 / 패드 구성
  ========================================================= */
  const canvas = document.getElementById('gameCanvas');
  const stageInner = document.getElementById('stageInner');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, 6.4, 6.6);
  camera.lookAt(0, -0.4, 0);

  scene.add(new THREE.AmbientLight(0x6a5ac9, 0.65));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
  keyLight.position.set(3, 8, 4);
  scene.add(keyLight);
  const pulseLight = new THREE.PointLight(0x7a5cf0, 1.4, 12, 2);
  pulseLight.position.set(0, 3.2, 2);
  scene.add(pulseLight);
  let pulseLightBase = { color:new THREE.Color(0x342a55), intensity:0.6 };
  pulseLight.color.copy(pulseLightBase.color);
  pulseLight.intensity = pulseLightBase.intensity;

  // 바닥
  const floorGeo = new THREE.PlaneGeometry(9, 9);
  const floorMat = new THREE.MeshStandardMaterial({ color:0x181228, roughness:1, metalness:0 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -0.55;
  scene.add(floor);

  const PAD_SIZE = 1.32, PAD_HEIGHT = 0.34, GAP = 0.22;
  const STEP = PAD_SIZE + GAP;
  const pads = {}; // id -> mesh

  ROWS.forEach((r, ri) => {
    COLS.forEach((c, ci) => {
      const id = r + c;
      const geo = new THREE.BoxGeometry(PAD_SIZE, PAD_HEIGHT, PAD_SIZE);
      const mat = new THREE.MeshStandardMaterial({
        color: COLOR_BASE_TOP, roughness:0.45, metalness:0.15,
        emissive: 0x000000, emissiveIntensity:1
      });
      const mesh = new THREE.Mesh(geo, mat);
      const x = (ci - 1.5) * STEP;
      const z = (ri - 1.5) * STEP;
      mesh.position.set(x, 0, z);
      mesh.userData = { id, baseY:0, pressed:false };
      // 살짝 베벨 느낌을 주는 얇은 하단 프레임
      const frameGeo = new THREE.BoxGeometry(PAD_SIZE*1.06, PAD_HEIGHT*0.4, PAD_SIZE*1.06);
      const frameMat = new THREE.MeshStandardMaterial({ color:0x100c1c, roughness:0.9 });
      const frame = new THREE.Mesh(frameGeo, frameMat);
      frame.position.y = -PAD_HEIGHT*0.55;
      mesh.add(frame);

      scene.add(mesh);
      pads[id] = mesh;
    });
  });

  function resizeRenderer(){
    const w = stageInner.clientWidth, h = stageInner.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resizeRenderer);

  /* =========================================================
     3. 패드 애니메이션 (트윈)
  ========================================================= */
  const activeTweens = [];
  function flashPad(id, colorHex, opts){
    const mesh = pads[id];
    if (!mesh) return;
    const cfg = Object.assign({ up:45, total:260, press:0.09 }, opts||{});
    activeTweens.push({
      mesh,
      color: new THREE.Color(colorHex),
      base: new THREE.Color(0x000000),
      start: performance.now(),
      up: cfg.up, total: cfg.total, press: cfg.press
    });
  }
  function pulseGlow(colorHex){
    pulseLight.color.set(colorHex);
    pulseLight.intensity = 2.4;
  }
  function updateTweens(now){
    for (let i = activeTweens.length - 1; i >= 0; i--){
      const tw = activeTweens[i];
      const elapsed = now - tw.start;
      let k, phaseColor, phaseY;
      if (elapsed <= tw.up){
        k = elapsed / tw.up;
        phaseColor = tw.base.clone().lerp(tw.color, k);
        phaseY = -tw.press * k;
      } else if (elapsed <= tw.total){
        k = (elapsed - tw.up) / (tw.total - tw.up);
        phaseColor = tw.color.clone().lerp(tw.base, k);
        phaseY = -tw.press * (1 - k);
      } else {
        tw.mesh.material.emissive.set(0x000000);
        tw.mesh.position.y = tw.mesh.userData.baseY;
        activeTweens.splice(i, 1);
        continue;
      }
      tw.mesh.material.emissive.copy(phaseColor);
      tw.mesh.position.y = tw.mesh.userData.baseY + phaseY;
    }
    // pulse light decay
    if (pulseLight.intensity > pulseLightBase.intensity){
      pulseLight.intensity += (pulseLightBase.intensity - pulseLight.intensity) * 0.12;
      pulseLight.color.lerp(pulseLightBase.color, 0.12);
    }
  }

  function loop(){
    requestAnimationFrame(loop);
    updateTweens(performance.now());
    renderer.render(scene, camera);
  }

  /* =========================================================
     4. 입력 처리 (raycaster)
  ========================================================= */
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const padList = Object.values(pads);

  function pointerToPad(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(padList, true);
    if (!hits.length) return null;
    let obj = hits[0].object;
    while (obj && !obj.userData.id) obj = obj.parent;
    return obj ? obj.userData.id : null;
  }

  function handlePointer(clientX, clientY){
    const id = pointerToPad(clientX, clientY);
    if (!id) return;
    onPadTap(id);
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handlePointer(e.clientX, e.clientY);
  }, { passive:false });

  /* =========================================================
     5. 게임 로직
  ========================================================= */
  const centerLabel = document.getElementById('centerLabel');
  const beatRing = document.getElementById('beatRing');

  function showLabel(text){
    centerLabel.textContent = text;
    centerLabel.classList.add('show');
  }
  function hideLabelSoon(){
    setTimeout(()=> centerLabel.classList.remove('show'), 700);
  }
  function pulseRing(){
    beatRing.classList.remove('pulse');
    void beatRing.offsetWidth; // reflow, 애니메이션 재시작
    beatRing.classList.add('pulse');
  }

  function updateHUD(){
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('levelVal').textContent = level;
    document.querySelectorAll('.heart').forEach((h, i) => {
      h.classList.toggle('dead', i >= lives);
    });
  }

  function startRound(isPractice){
    clearTimeout(roundTimer);
    const pattern = isPractice ? PRACTICE_PATTERNS[practiceIndex] : pickMainPattern();
    const iv = isPractice ? BASE_INTERVAL : currentInterval;
    const seq = pattern.seq, target = pattern.target;
    const t0 = performance.now() + 60;
    const tapTimes = [t0, t0 + iv, t0 + iv*2];
    const targetTime = t0 + iv*3;

    currentRound = { seq, target, isPractice, targetTime, resolved:false };
    waitingForUser = false;

    if (isPractice) showLabel('PRACTICE ' + (practiceIndex+1) + ' / 4');
    else centerLabel.classList.remove('show');

    tapTimes.forEach((t) => {
      const delay = Math.max(0, t - performance.now());
      setTimeout(() => {
        if (!currentRound) return;
        const stepIdx = tapTimes.indexOf(t);
        flashPad(seq[stepIdx], COLOR_GUIDE, { total:220, press:0.07 });
        pulseGlow(COLOR_GUIDE);
        pulseRing();
        playGuideTick();
        if (stepIdx === 2) waitingForUser = true; // 마지막 안내 이후 유저 대기
      }, delay);
    });

    const missDelay = Math.max(0, (targetTime + HIT_WINDOW + 40) - performance.now());
    roundTimer = setTimeout(() => {
      if (currentRound && !currentRound.resolved) resolveRound(null, false);
    }, missDelay);
  }

  function onPadTap(id){
    if (state === 'idle' || state === 'gameover') return;
    if (!waitingForUser || !currentRound || currentRound.resolved) return;
    const now = performance.now();
    playUserTick();
    const withinWindow = Math.abs(now - currentRound.targetTime) <= HIT_WINDOW;
    const correctPad = id === currentRound.target;
    resolveRound(id, withinWindow && correctPad);
  }

  function resolveRound(tappedId, success){
    if (!currentRound || currentRound.resolved) return;
    currentRound.resolved = true;
    waitingForUser = false;
    clearTimeout(roundTimer);

    const flashId = tappedId || currentRound.target;
    if (success){
      flashPad(flashId, COLOR_SUCCESS);
      pulseGlow(COLOR_SUCCESS);
      playSuccessSound();
      if (!currentRound.isPractice){ score += 10; successCount++; }
    } else {
      flashPad(flashId, COLOR_FAIL);
      pulseGlow(COLOR_FAIL);
      playFailSound();
      if (!currentRound.isPractice){ lives--; }
    }
    updateHUD();

    if (!currentRound.isPractice && lives <= 0){
      setTimeout(gameOver, 500);
      return;
    }

    if (!currentRound.isPractice && successCount >= SUCCESS_PER_LEVEL){
      successCount = 0;
      level++;
      currentInterval = Math.round(currentInterval * SPEED_UP_FACTOR);
      updateHUD();
      setTimeout(() => showLabel('LEVEL ' + level + '!'), ROUND_GAP - 150);
      setTimeout(() => playLevelUpSound(), ROUND_GAP - 150);
      hideLabelSoon();
    }

    const wasPractice = currentRound.isPractice;
    setTimeout(() => nextRound(wasPractice), ROUND_GAP);
  }

  function nextRound(wasPractice){
    if (state === 'gameover') return;
    if (wasPractice){
      if (practiceIndex < PRACTICE_PATTERNS.length - 1){
        practiceIndex++;
        startRound(true);
      } else {
        startMainGame();
      }
    } else {
      startRound(false);
    }
  }

  function startPractice(){
    state = 'practice';
    practiceIndex = 0;
    startRound(true);
  }

  function startMainGame(){
    state = 'playing';
    showLabel('GO!');
    hideLabelSoon();
    setTimeout(() => startRound(false), 500);
  }

  function gameOver(){
    state = 'gameover';
    currentRound = null;
    document.getElementById('finalScoreVal').textContent = score;
    document.getElementById('finalLevelVal').textContent = 'LEVEL ' + level + ' 에서 종료';
    document.getElementById('gameOverOverlay').hidden = false;
  }

  function resetGame(){
    score = 0; level = 1; lives = 3;
    currentInterval = BASE_INTERVAL;
    successCount = 0; practiceIndex = 0;
    currentRound = null; waitingForUser = false;
    lastPatternKey = null;
    updateHUD();
    document.getElementById('gameOverOverlay').hidden = true;
  }

  /* =========================================================
     6. 부트스트랩
  ========================================================= */
  document.getElementById('startBtn').addEventListener('click', () => {
    ensureAudio();
    document.getElementById('startOverlay').hidden = true;
    resetGame();
    startPractice();
  });
  document.getElementById('retryBtn').addEventListener('click', () => {
    ensureAudio();
    resetGame();
    startPractice();
  });

  updateHUD();
  resizeRenderer();
  // 레이아웃 확정 후 한번 더 리사이즈 (폰트 로딩 등으로 인한 크기 변화 보정)
  setTimeout(resizeRenderer, 200);
  loop();

})();
</script>
